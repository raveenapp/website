<article>
    <h4><a href="{{ .Permalink}}">{{ .Title}}</a></h4>
    <b><time>{{ .Date.Format "2006-01-02" }}</time></b>
    {{ range .Params.tags}}
    <a href="{{ "/tags/" | relURL}}{{ . | urlize }}">{{ . }}</a>
    {{ end }}
    <div>
		{{ .Summary }}
		{{ if .Truncated }}
			<a href="{{ .Permalink }}">Read more...</a>
		{{ end }}
	</div>
</article>
